<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Wiki del Servidor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="top-nav">
        <div><a href="/">MC Server Wiki</a></div>
        <div><a href="/admin">⚙️ Admin</a></div>
    </header>
    <div class="container">
        <aside class="sidebar">
            <ul>
                <li><a href="/">🏠 Inicio</a></li>
                <li><a href="#">⚔️ Jefes Descubiertos</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <div class="panel">
                <h2>⚔️ Jefes Descubiertos</h2>
                <div id="boss-container">Cargando...</div>
            </div>
        </main>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const res = await fetch('/api/jefes');
            const jefes = await res.json();
            const container = document.getElementById('boss-container');
            container.innerHTML = '';
            jefes.forEach(j => {
                container.innerHTML += `
                    <div class="boss-item">
                        <img src="${j.imagen_url || 'https://via.placeholder.com/60'}" alt="jefe">
                        <div><h3>${j.nombre}</h3><p>${j.descripcion}</p></div>
                    </div>`;
            });
        });
    </script>
</body>
</html>
